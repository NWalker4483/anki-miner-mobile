services:
  anki:
    build:
      context: ./anki
      args:
        ADDON_IDS: "2055492159"
    image: headless-anki:addons-v1.4.0
    command: [
      "/bin/sh",
      "-c",
      "echo 'DEBUG: Checking config file...'; if [ -f /data/addons21/2055492159/config.json ]; then echo 'DEBUG: Found, patching...'; jq '.webBindAddress = \"0.0.0.0\"' /data/addons21/2055492159/config.json > /tmp/config.json && mv /tmp/config.json /data/addons21/2055492159/config.json; echo 'DEBUG: Patch complete.'; else echo 'DEBUG: Config not found.'; fi; rm -f /tmp/.X99-lock /tmp/.X11-unix/X99 2>/dev/null; exec /startup.sh"
    ]
    environment:
      ANKICONNECT_BIND_ADDRESS: "0.0.0.0"
      ANKIWEB_USERNAME: "${ANKIWEB_USERNAME:-}"
      ANKIWEB_PASSWORD: "${ANKIWEB_PASSWORD:-}"
      ANKIWEB_SYNC_ON_CONFLICT: "${ANKIWEB_SYNC_ON_CONFLICT:-download}"
      ANKIWEB_SYNC_ON_START: "${ANKIWEB_SYNC_ON_START:-1}"
    volumes:
      - anki_data:/data
      - "./data/user1:/data/User 1"
      - "./anki/addons:/data/addons21"
    ports:
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:8766:8765"
      - "127.0.0.1:3141:3141"
    restart: unless-stopped

  webapp:
    build:
      context: ./webapp
    image: anki-ocr-webapp:dev
    environment:
      ANKICONNECT_URL: "http://anki:8765"
      TTS_URL: "http://tts:8080"
      OCR_LANG: "chi_sim+eng"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      - anki
      - tts
    restart: unless-stopped

  tts:
    build:
      context: ./tts
    image: anki-tts-piper:dev
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - webapp
    environment:
      # Explicitly set the log level to debug to see why requests might be failing
      - TUNNEL_LOG_LEVEL=debug

volumes:
  anki_data:
